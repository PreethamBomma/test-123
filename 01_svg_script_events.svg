<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <rect width="400" height="200" fill="white"/>

  <!-- Direct script -->
  <script>alert('SVG-01-SCRIPT')</script>

  <!-- SVG load event -->
  <g onload="alert('SVG-01-ONLOAD')">
    <circle cx="80" cy="80" r="40" fill="red"/>
  </g>

  <!-- Animation event -->
  <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 200 100"
      to="360 200 100"
      dur="1s"
      onbegin="alert('SVG-01-ONBEGIN')"/>

  <!-- Click event -->
  <rect x="150" y="50" width="100" height="80"
        fill="blue"
        onclick="alert('SVG-01-ONCLICK')"/>
</svg>
