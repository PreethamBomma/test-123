<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250">

  <rect width="500" height="250" fill="white"/>

  <!-- javascript URI test -->
  <a href="javascript:alert('SVG-03-JSURI')">
    <text x="20" y="50" font-size="20">JavaScript URI test</text>
  </a>

  <!-- data URI test -->
  <image x="20" y="70" width="120" height="120"
         href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Cscript%3Ealert('SVG-03-DATA')%3C/script%3E%3C/svg%3E"/>

  <!-- Event-handler test -->
  <text x="20" y="220" font-size="20"
        onmouseover="alert('SVG-03-MOUSEOVER')">
    Mouseover test
  </text>
</svg>
